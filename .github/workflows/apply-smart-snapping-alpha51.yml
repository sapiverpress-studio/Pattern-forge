name: Apply Pattern Forge alpha.5.1 smart snapping

on:
  push:
    branches:
      - feature/layer-engine-v1.2
    paths:
      - dev/apply-smart-snapping-alpha51.py
      - .github/workflows/apply-smart-snapping-alpha51.yml

permissions:
  contents: write

jobs:
  apply-smart-snapping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/layer-engine-v1.2
          fetch-depth: 0

      - name: Apply guarded patch
        run: python3 dev/apply-smart-snapping-alpha51.py

      - name: Check embedded JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          start=html.rfind('<script>'); end=html.rfind('</script>')
          if start<0 or end<=start: raise SystemExit('embedded script not found')
          Path('/tmp/pf.js').write_text(html[start+8:end],encoding='utf-8')
          PY
          node --check /tmp/pf.js

      - name: Verify smart snapping guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          checks=[
            '<meta name="app-version" content="1.2.0-alpha.5.1">',
            'Smart snapping uses the grid plus tile centre lines and tile edges.',
            'function smartSnapPosition(',
            'function itemSnapHalfExtents(',
            'function drawSnapGuides(',
            'drawSnapGuides(ctx,sc);',
            'clearSnapGuides();renderAll();',
          ]
          missing=[x for x in checks if x not in html]
          if missing: raise SystemExit('smart snapping guard missing: '+repr(missing))
          if 'function snapCoordinate(v)' in html: raise SystemExit('legacy grid-only snapCoordinate remains')
          print('smart snapping guards present')
          PY

      - name: Commit alpha.5.1
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add smart snapping and alignment guides in alpha.5.1'
          git push origin HEAD:feature/layer-engine-v1.2
