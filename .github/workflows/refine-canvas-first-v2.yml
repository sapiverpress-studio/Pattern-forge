name: Refine canvas-first runtime

on:
  push:
    branches: [feature/canvas-first-ux-v2]
    paths:
      - dev/refine-canvas-first-v2.py
      - .github/workflows/refine-canvas-first-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/canvas-first-ux-v2
      - name: Apply runtime refinement
        run: python3 dev/refine-canvas-first-v2.py
      - name: Check adapter syntax
        run: node --check app/js/canvas-first-v2.js
      - name: Commit refinement
        run: |
          if git diff --quiet -- app/js/canvas-first-v2.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/js/canvas-first-v2.js
          git commit -m 'Refine canvas-first selection and runtime observers'
          git push origin HEAD:feature/canvas-first-ux-v2
