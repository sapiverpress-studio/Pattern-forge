name: Raised oil and piped paint brush checks
on:
  push:
    branches: [feature/raised-impasto-brushes-20261012]
    paths:
      - app/js/raised-paint.js
      - app/js/editor.js
      - app/js/canvas-first-v2.js
      - app/index.html
      - app/assets/canvas-first-v2.css
      - tests/raised-paint-geometry.test.mjs
      - tests/raised-paint-browser.mjs
      - .github/workflows/raised-paint-checks.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax and geometry checks
        run: |
          node --check app/js/raised-paint.js
          node --check app/js/editor.js
          node --check app/js/canvas-first-v2.js
          node --check tests/raised-paint-browser.mjs
          node tests/raised-paint-geometry.test.mjs
      - name: Install isolated Chromium runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Draw oil, piped and knife marks and export on Pattern and Doodle
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/pf-raised-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node tests/raised-paint-browser.mjs
      - name: Run existing project, recovery, layout and export regressions
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/pf-raised-existing.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          UX2_AUDIT_OUTPUT=/tmp/pf-raised-existing-results node tests/ux2-extended-readiness.mjs
