name: Pattern Forge Doodle Mode smoke test

on:
  push:
    branches:
      - feature/layer-engine-v1.2
    paths:
      - index.html
      - tests/doodle-mode-smoke.mjs
      - .github/workflows/doodle-mode-smoke.yml

permissions:
  contents: read

jobs:
  doodle-mode-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/layer-engine-v1.2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve Pattern Forge
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/pf-http.log 2>&1 &
          ok=0
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then ok=1; break; fi
            sleep 0.5
          done
          if [ "$ok" != 1 ]; then cat /tmp/pf-http.log || true; exit 1; fi
      - name: Run Doodle Mode browser smoke test
        run: node tests/doodle-mode-smoke.mjs
