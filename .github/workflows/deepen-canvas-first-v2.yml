name: Deepen canvas-first UX

on:
  push:
    branches: [feature/canvas-first-ux-v2]
    paths:
      - dev/deepen-canvas-first-v2.py
      - .github/workflows/deepen-canvas-first-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deepen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/canvas-first-ux-v2
      - run: python3 dev/deepen-canvas-first-v2.py
      - run: node --check app/js/canvas-first-v2.js
      - name: Commit depth pass
        run: |
          if git diff --quiet -- app/js/canvas-first-v2.js app/assets/canvas-first-v2.css; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/js/canvas-first-v2.js app/assets/canvas-first-v2.css
          git commit -m 'Expose advanced controls in canvas-first UX'
          git push origin HEAD:feature/canvas-first-ux-v2
