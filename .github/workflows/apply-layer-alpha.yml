name: Apply v1.2 layer alpha

on:
  push:
    branches: ['feature/layer-engine-v1.2']
    paths:
      - 'dev/layer-engine-alpha.patch.gz.b64'
      - '.github/workflows/apply-layer-alpha.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode and verify patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode dev/layer-engine-alpha.patch.gz.b64 | gzip -d > /tmp/layer-engine.patch
          echo 'acfd5352b657975ddb9262702ee9f3b22b25b016447ccae78c4e659277f17d29  /tmp/layer-engine.patch' | sha256sum -c -
          git apply --check /tmp/layer-engine.patch
          git apply /tmp/layer-engine.patch
      - name: Syntax-check embedded JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          html=Path('index.html').read_text()
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',html)
          if len(scripts)!=1:
              raise SystemExit(f'Expected exactly one inline script, found {len(scripts)}')
          Path('/tmp/pattern-forge.js').write_text(scripts[0])
          PY
          node --check /tmp/pattern-forge.js
      - name: Commit alpha source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add backward-compatible v1.2 layer engine alpha'
          git push
