name: Import Expo mobile shell for UX2

on:
  push:
    branches: [feature/canvas-first-ux-v2]
    paths:
      - .github/workflows/import-mobile-ux2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/canvas-first-ux-v2
          fetch-depth: 0
      - name: Import tested Expo shell
        run: |
          git fetch origin feature/expo-go-live-test
          git checkout origin/feature/expo-go-live-test -- mobile
      - name: Adapt shell to UX2 and tunnel hosts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mobile/App.tsx')
          s=p.read_text(encoding='utf-8')
          s=s.replace('  SafeAreaView,\n  StyleSheet,','  StatusBar as RNStatusBar,\n  StyleSheet,')
          s=s.replace("import { StatusBar } from 'expo-status-bar';","import { StatusBar as ExpoStatusBar } from 'expo-status-bar';")
          s=s.replace("const ALLOWED_HOST = 'sapiver-pattern-forge.netlify.app';","const ALLOWED_HOST = new URL(PATTERN_FORGE_URL).hostname;")
          s=s.replace("  const [loadError, setLoadError] = useState(false);\n  const [currentUrl, setCurrentUrl] = useState(PATTERN_FORGE_URL);","  const [loadError, setLoadError] = useState(false);\n  const [loadProgress, setLoadProgress] = useState(0);\n  const [currentUrl, setCurrentUrl] = useState(PATTERN_FORGE_URL);")
          anchor="  const handleMessage = useCallback(async (event: WebViewMessageEvent) => {"
          timeout="""  useEffect(() => {
    if (!loading || loadError) return;
    const timer = setTimeout(() => {
      setLoading(false);
      setLoadError(true);
    }, 15000);
    return () => clearTimeout(timer);
  }, [loading, loadError, currentUrl]);

"""
          if timeout.strip() not in s:
              s=s.replace(anchor,timeout+anchor,1)
          s=s.replace('    <SafeAreaView style={styles.safeArea}>\n      <StatusBar style="light" />','    <View style={styles.safeArea}>\n      <ExpoStatusBar style="dark" />')
          s=s.replace("          onLoadStart={() => {\n            setLoading(true);\n            setLoadError(false);\n          }}\n          onLoadEnd={() => setLoading(false)}","          onLoadStart={() => {\n            setLoadProgress(0);\n            setLoading(true);\n            setLoadError(false);\n          }}\n          onLoadProgress={(event) => {\n            const progress = event.nativeEvent.progress;\n            setLoadProgress(progress);\n            if (progress >= 0.8) setLoading(false);\n          }}\n          onLoadEnd={() => {\n            setLoadProgress(1);\n            setLoading(false);\n          }}")
          s=s.replace('            <ActivityIndicator size="large" color="#2c6658" />','            <ActivityIndicator size="large" color="#526d8f" />\n            <Text style={styles.loadingText}>Loading Pattern Forge… {Math.round(loadProgress * 100)}%</Text>')
          s=s.replace('            <Text style={styles.errorText}>Check your internet connection and try again.</Text>','            <Text style={styles.errorText}>Pattern Forge did not finish loading. Check your connection and try again.</Text>')
          s=s.replace('    </SafeAreaView>','    </View>')
          s=s.replace("  safeArea: {\n    flex: 1,\n    backgroundColor: '#2c6658',\n  },","  safeArea: {\n    flex: 1,\n    paddingTop: Platform.OS === 'android' ? (RNStatusBar.currentHeight ?? 0) : 0,\n    backgroundColor: '#eef1f4',\n  },")
          if 'loadingText:' not in s:
              s=s.replace('  errorOverlay: {',"  loadingText: {\n    marginTop: 14,\n    fontSize: 15,\n    color: '#526d8f',\n  },\n  errorOverlay: {")
          s=s.replace("backgroundColor: '#2c6658'","backgroundColor: '#526d8f'")
          if 'SafeAreaView' in s: raise SystemExit('SafeAreaView remains')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify mobile project
        working-directory: mobile
        run: |
          npm ci
          npm run typecheck
          npx expo-doctor
      - name: Commit mobile UX2 shell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile
          git commit -m 'Bring Expo mobile shell into canvas-first UX2'
          git push origin HEAD:feature/canvas-first-ux-v2
