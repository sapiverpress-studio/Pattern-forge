name: Apply v1.2 layer alpha.2

on:
  push:
    branches: ['feature/layer-engine-v1.2']
    paths:
      - 'dev/layer-alpha2.patch.gz.b64'
      - '.github/workflows/apply-layer-alpha2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode and verify patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode dev/layer-alpha2.patch.gz.b64 | gzip -d > /tmp/layer-alpha2.patch
          echo '98558c6b1370048e4951346c4fd1e6618f0be2f7e443f5ed9dc885b0a39a3a91  /tmp/layer-alpha2.patch' | sha256sum -c -
          git apply --check /tmp/layer-alpha2.patch
          git apply /tmp/layer-alpha2.patch
      - name: Verify exact tested source and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          echo '902eae2e63c8be86f2d27544bbccf274f78d8e7268d3f878c169c412a99a2680  index.html' | sha256sum -c -
          python - <<'PY'
          import re
          from pathlib import Path
          html=Path('index.html').read_text()
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',html)
          if len(scripts)!=1:
              raise SystemExit(f'Expected exactly one inline script, found {len(scripts)}')
          Path('/tmp/pattern-forge.js').write_text(scripts[0])
          PY
          node --check /tmp/pattern-forge.js
      - name: Commit hardened alpha source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Harden layer rendering before UI exposure'
          git push
