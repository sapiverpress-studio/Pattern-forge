name: Verify nested motif search on live Pattern Forge
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-nested-motif-live-once.yml]
permissions:
  contents: read
jobs:
  live-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PF_TEST_BASE_URL: https://sapiver-pattern-forge.netlify.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify live source has nested-path support
        run: |
          curl --retry 5 -fsSL "$PF_TEST_BASE_URL/app/js/motif-packs.js" | grep -q 'relativePath:path'
          curl --retry 5 -fsSL "$PF_TEST_BASE_URL/app/js/canvas-first-v2.js" | grep -q 'ux2MotifSearch'
      - name: Install live browser runtime
        run: |
          npm install --no-save playwright@1.55.0 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Verify live nested ZIPs and global search
        run: node tests/motif-collection-browser.mjs
