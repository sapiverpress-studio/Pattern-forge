name: Canvas-first live editor

on:
  push:
    branches: [feature/canvas-first-ux-v2]
    paths:
      - app/**
      - dev/apply-canvas-first-live.py
      - tests/canvas-first-live-smoke.mjs
      - .github/workflows/canvas-first-live.yml
  workflow_dispatch:

jobs:
  live-editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/canvas-first-ux-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply live shell integration
        run: python3 dev/apply-canvas-first-live.py
      - name: Syntax checks
        run: |
          node --check app/js/editor.js
          node --check app/js/workspace.js
          node --check app/js/canvas-first-shell.js
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Serve branch
        run: |
          mkdir -p live-shots
          python3 -m http.server 4173 >/tmp/pf-live.log 2>&1 &
          sleep 2
      - name: Run live canvas-first smoke
        run: node tests/canvas-first-live-smoke.mjs
      - name: Upload live screenshots
        uses: actions/upload-artifact@v4
        with:
          name: canvas-first-live-screenshots
          path: live-shots/*.png
          retention-days: 7
      - name: Commit tested live integration
        run: |
          git config user.name "sapiverpress-studio"
          git config user.email "sapiverpress@gmail.com"
          git add app/index.html app/js/workspace.js app/js/canvas-first-shell.js
          if ! git diff --cached --quiet; then
            git commit -m "Integrate canvas-first shell with real editor engine"
            git push origin HEAD:feature/canvas-first-ux-v2
          fi
