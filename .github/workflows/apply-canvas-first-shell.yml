name: Apply canvas-first real editor shell

on:
  push:
    branches: [feature/canvas-first-ux-v2]
    paths:
      - dev/apply-canvas-first-shell.py
      - .github/workflows/apply-canvas-first-shell.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/canvas-first-ux-v2
      - name: Apply real-editor shell patch
        run: python3 dev/apply-canvas-first-shell.py
      - name: Syntax check adapter
        run: node --check app/js/canvas-first-v2.js
      - name: Commit integrated shell
        run: |
          if git diff --quiet -- app/index.html; then
            echo 'Shell already integrated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/index.html
          git commit -m 'Integrate real editor with canvas-first shell'
          git push origin HEAD:feature/canvas-first-ux-v2
