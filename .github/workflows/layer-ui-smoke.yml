name: Pattern Forge layer UI smoke test

on:
  push:
    branches:
      - feature/layer-engine-v1.2
    paths:
      - index.html
      - tests/layer-ui-smoke.mjs
      - .github/workflows/layer-ui-smoke.yml

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/layer-engine-v1.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve Pattern Forge
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/pattern-forge-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pattern-forge-http.log
          exit 1

      - name: Run layer browser smoke tests
        run: node tests/layer-ui-smoke.mjs
