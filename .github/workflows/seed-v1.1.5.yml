name: Seed v1.1.5 baseline

on:
  push:
    branches: [main]
    paths:
      - 'seed/index.part*.b64'
      - '.github/workflows/seed-v1.1.5.yml'

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct canonical app
        shell: bash
        run: |
          set -euo pipefail
          cat seed/index.part01.b64 seed/index.part02.b64 seed/index.part03.b64 seed/index.part04.b64 \
            | base64 --decode \
            | gzip -d > index.html
          echo '70690376d24f34375e9723175ef9d3f7419f3f578ac5fe5379fa5e977ee5552e  index.html' | sha256sum -c -
      - name: Commit exact baseline source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Add exact v1.1.5 canonical app source'
          git push
