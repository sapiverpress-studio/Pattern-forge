name: Pattern Forge smart snapping smoke test

on:
  push:
    branches:
      - feature/layer-engine-v1.2
    paths:
      - index.html
      - tests/smart-snapping-smoke.mjs
      - .github/workflows/smart-snapping-smoke.yml
  workflow_dispatch:

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/layer-engine-v1.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright >/dev/null 2>&1
          npx playwright install chromium --with-deps >/dev/null 2>&1
      - name: Serve Pattern Forge
        run: |
          python3 -m http.server 4173 >/tmp/pf-server.log 2>&1 &
          sleep 1
      - name: Run smart snapping browser smoke test
        run: node tests/smart-snapping-smoke.mjs
