name: One-time licence-checked knit texture import
on:
  push:
    branches:
      - fix/realistic-cosy-knitting-20261106
    paths:
      - .github/workflows/knit-assets-one-time.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download CC0 knit materials for local serving
        run: |
          set -euo pipefail
          mkdir -p knit/textures
          curl --fail --location --retry 3 --max-time 90 'https://cdn.meshy.ai/landing-assets/textures/fabric/grey-chunky-knit/grey-chunky-knit-2k.jpg' --output knit/textures/grey-chunky-knit.jpg
          curl --fail --location --retry 3 --max-time 90 'https://cdn.meshy.ai/landing-assets/textures/fabric/cream-cable-knit/cream-cable-knit-2k.jpg' --output knit/textures/cream-cable-knit.jpg
          curl --fail --location --retry 3 --max-time 90 'https://cdn.meshy.ai/landing-assets/textures/fabric/rust-orange-knit/rust-orange-knit-2k.jpg' --output knit/textures/rust-orange-knit.jpg
          python3 - <<'PY'
          from pathlib import Path
          for p in sorted(Path('knit/textures').glob('*.jpg')):
              b=p.read_bytes()
              assert b[:3]==bytes.fromhex('ffd8ff') and b[-2:]==bytes.fromhex('ffd9'),f'Invalid JPEG {p}'
              assert 20_000<len(b)<4_500_000,f'Unexpected size {p} {len(b)}'
              print(p,len(b))
          PY
      - name: Commit only the fixed-source material assets to this feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knit/textures/*.jpg
          git diff --cached --quiet && exit 0
          git commit -m "assets: add CC0 knitted photo textures to standalone knit workspace"
          git push origin HEAD:fix/realistic-cosy-knitting-20261106