name: Deploy one-time knitted-wool preview to separate Netlify site
on:
  push:
    branches:
      - preview/knit-hybrid-mobile-20261106
    paths:
      - .github/workflows/knit-preview-deploy-once.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: sapiver-knit-hybrid-preview-deploy
  cancel-in-progress: false
jobs:
  publish-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      NETLIFY_SITE_ID: 3bfeee82-cf8f-4dcd-9dd9-0ab820ac329c
      SOURCE_ARTIFACT_ID: "13538435032"
      SOURCE_RUN_ID: "42286153930"
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exactly the previously tested real Blender render
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p knit-preview/assets /tmp/wool-reference
          curl --fail --location --silent --show-error --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            -o /tmp/knit-preview-source.zip
          unzip -oq /tmp/knit-preview-source.zip -d /tmp/wool-reference
          sample="$(find /tmp/wool-reference -name 'wool-preview-720-300dpi.png' -type f -print -quit)"
          test -n "$sample"
          cp "$sample" knit-preview/assets/knitted-wool-720.png
      - name: Verify exact preview dimensions, real PNG bytes and source provenance
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, struct, pathlib, os, zlib
          image=pathlib.Path('knit-preview/assets/knitted-wool-720.png').read_bytes()
          assert image[:8]==b'\x89PNG\r\n\x1a\n','Not a PNG'
          width,height=struct.unpack('>II',image[16:24])
          assert (width,height)==(720,720),'Unexpected dimensions'
          found=False
          i=8
          while i+12<=len(image):
              n=struct.unpack('>I',image[i:i+4])[0]
              typ=image[i+4:i+8]
              if typ==b'pHYs':
                  x,y,unit=struct.unpack('>IIB',image[i+8:i+17])
                  assert unit==1 and abs(x-11811)<10 and abs(y-11811)<10,'Missing 300 DPI'
                  found=True
              i+=n+12
          assert found,'300 DPI metadata missing'
          assert len(image)>10000,'PNG implausibly small'
          build={'sample':'actual tested TexGen + Blender + Pillow PNG',
                 'sample_size':'720 x 720','dpi':300,
                 'original_github_actions_run':int(os.environ['SOURCE_RUN_ID']),
                 'original_github_artifact_id':int(os.environ['SOURCE_ARTIFACT_ID']),
                 'site_git_commit':os.environ['GITHUB_SHA'],
                 'status':'visual QA preview; NOT a live rendering service'}
          pathlib.Path('knit-preview/build.json').write_text(json.dumps(build,indent=2))
          print('PASS: 720x720 PNG with 300 DPI, '+str(len(image))+' bytes')
          PY
          test -f knit-preview/index.html
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish ONLY to separate preview Netlify site
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$NETLIFY_AUTH_TOKEN"
          npx --yes netlify-cli@latest deploy \
            --dir knit-preview \
            --site "$NETLIFY_SITE_ID" \
            --auth "$NETLIFY_AUTH_TOKEN" \
            --prod --json > /tmp/knit-preview-deploy.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/knit-preview-deploy.json'))
          print('Deployed preview site:',d.get('url') or d.get('deploy_url'))
          print('Deploy id:',d.get('deploy_id'))
          PY
