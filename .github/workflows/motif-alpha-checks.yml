name: Pattern Forge motif alpha verification

on:
  push:
    branches:
      - feature/verify-motif-alpha-and-clean-solid-bg-20261024
  pull_request:
    paths:
      - app/**
      - tests/motif-alpha-browser.mjs
      - .github/workflows/motif-alpha-checks.yml

permissions:
  contents: read

jobs:
  alpha:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source JavaScript syntax
        run: |
          node --check app/js/editor.js
          node --check app/js/image-alpha.js
          node --check app/js/motif-remix.js
          node --check app/js/canvas-first-v2.js
          node --check tests/motif-alpha-browser.mjs
      - name: Install browser testing package
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          which google-chrome
      - name: Serve Pattern Forge
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/pf-alpha-import.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:4173/app/ >/dev/null
      - name: Verify actual alpha status and safe background cleanup on Android
        run: node tests/motif-alpha-browser.mjs
