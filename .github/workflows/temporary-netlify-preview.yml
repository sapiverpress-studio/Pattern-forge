name: Temporary Netlify live preview

on:
  push:
    branches:
      - feature/advanced-editing-v1
    paths:
      - '.github/temporary-netlify-preview-trigger'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_COMMIT }}

      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"

      - name: Assemble exact static package
        run: python3 dev/package-ux2-staging.py ux2-staging-site --commit "$EXPECTED_COMMIT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Test packaged site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory ux2-staging-site >/tmp/pf-preview-test.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do curl -fsS http://127.0.0.1:4173/build.json >/dev/null && break; sleep 1; done
          node tests/ux2-complete-ux-audit.mjs
          node tests/ux2-extended-readiness.mjs

      - name: Deploy anonymous Netlify preview
        run: |
          npx --yes netlify-cli@latest deploy             --allow-anonymous             --dir ux2-staging-site             --no-build             --json | tee /tmp/netlify-preview.json
          cat /tmp/netlify-preview.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: temporary-netlify-preview-result
          path: |
            /tmp/netlify-preview.json
            ux2-staging-site/build.json
            ux2-audit/
            ux2-extended-results/
          retention-days: 1
