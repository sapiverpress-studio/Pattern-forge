name: Pattern Forge mobile density smoke test

on:
  push:
    branches:
      - feature/mobile-density-v1.2
    paths:
      - index.html
      - tests/mobile-density-smoke.mjs
      - .github/workflows/mobile-density-smoke.yml

permissions:
  contents: read

jobs:
  mobile-density-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mobile-density-v1.2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Prepare alpha.3 comparison source
        run: |
          mkdir -p /tmp/pattern-forge-alpha3
          git show d61cc917483c35df7f92739bd0b8b085c71ca828:index.html > /tmp/pattern-forge-alpha3/index.html
      - name: Serve current and alpha.3 Pattern Forge
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/pf-current.log 2>&1 &
          (cd /tmp/pattern-forge-alpha3 && python3 -m http.server 4174 --bind 127.0.0.1 >/tmp/pf-alpha3.log 2>&1 &)
          for port in 4173 4174; do
            ok=0
            for i in {1..20}; do
              if curl -fsS http://127.0.0.1:$port/ >/dev/null; then ok=1; break; fi
              sleep 0.5
            done
            if [ "$ok" != 1 ]; then
              cat /tmp/pf-current.log || true
              cat /tmp/pf-alpha3.log || true
              exit 1
            fi
          done
      - name: Run mobile density browser smoke test
        run: node tests/mobile-density-smoke.mjs
      - name: Re-run Doodle compatibility smoke
        run: node tests/doodle-mode-smoke.mjs
      - name: Re-run layer UI compatibility smoke
        run: node tests/layer-ui-smoke.mjs
      - name: Re-run drawn selection compatibility smoke
        run: node tests/drawn-selection-smoke.mjs
      - name: Re-run mark transform compatibility smoke
        run: node tests/mark-transform-smoke.mjs
      - name: Re-run construction guides compatibility smoke
        run: node tests/construction-guides-smoke.mjs
      - name: Re-run smart snapping compatibility smoke
        run: node tests/smart-snapping-smoke.mjs
      - name: Re-run eyedropper compatibility smoke
        run: node tests/eyedropper-return-smoke.mjs
      - name: Re-run real eraser compatibility smoke
        run: node tests/real-eraser-smoke.mjs
      - name: Upload mobile QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: pattern-forge-mobile-density-qa
          path: mobile-qa/*.png
          if-no-files-found: error
