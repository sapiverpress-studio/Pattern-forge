name: Apply Pattern Forge alpha.6.2 mobile density

on:
  push:
    branches:
      - feature/mobile-density-v1.2
    paths:
      - dev/apply-mobile-density-alpha62.py
      - .github/workflows/apply-mobile-density-alpha62.yml

permissions:
  contents: write

jobs:
  apply-mobile-density:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mobile-density-v1.2
          fetch-depth: 0
      - name: Apply guarded mobile density patch
        run: python3 dev/apply-mobile-density-alpha62.py
      - name: Check embedded JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          start=html.rfind('<script>'); end=html.rfind('</script>')
          if start<0 or end<=start: raise SystemExit('embedded script not found')
          Path('/tmp/pf.js').write_text(html[start+8:end],encoding='utf-8')
          PY
          node --check /tmp/pf.js
      - name: Verify mobile density guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          checks=[
            'content="1.2.0-alpha.6.2"',
            'id="drawingControlsDisclosure"',
            'id="imagesDisclosure"',
            'id="layersDisclosure"',
            'id="previewDisclosure"',
            'id="exportDisclosure"',
            'function setMobileSection(targetId="stageWrap")',
          ]
          missing=[x for x in checks if x not in html]
          if missing: raise SystemExit('mobile density guard missing: '+repr(missing))
          print('mobile density guards present')
          PY
      - name: Commit alpha.6.2
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Compact mobile workspace in alpha.6.2'
          git push origin HEAD:feature/mobile-density-v1.2
