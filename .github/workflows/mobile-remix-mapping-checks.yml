name: Pattern Forge mobile remix mapping

on:
  push:
    branches:
      - feature/mobile-remix-flow-individual-copies-20261024
  pull_request:
    paths:
      - app/**
      - tests/mobile-remix-copy-browser.mjs
      - .github/workflows/mobile-remix-mapping-checks.yml

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check app/js/editor.js
          node --check app/js/motif-remix.js
          node --check tests/mobile-remix-copy-browser.mjs
      - name: Install Playwright without browser download
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          which google-chrome
      - name: Serve Pattern Forge
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/pf-mobile-remix.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:4173/app/ >/dev/null
      - name: Mobile copy mapping regression
        run: node tests/mobile-remix-copy-browser.mjs
