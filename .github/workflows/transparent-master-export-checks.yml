name: Pattern Forge transparent master export

on:
  push:
    branches:
      - feature/transparent-master-export-20261023
  pull_request:
    paths:
      - app/**
      - tests/transparent-master-export-browser.mjs
      - .github/workflows/transparent-master-export-checks.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript
        run: |
          node --check app/js/editor.js
          node --check app/js/canvas-first-v2.js
          node --check app/js/etsy-export.js
          node --check tests/transparent-master-export-browser.mjs
      - name: Install test browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium --with-deps >/dev/null 2>&1
      - name: Serve source project
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/pf-alpha.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:4173/app/ >/dev/null
      - name: Verify PNG alpha, SVG, ZIP, toggles and project safety
        run: node tests/transparent-master-export-browser.mjs
