name: Fix canvas-first Doodle and QA bridge

on:
  push:
    branches: [feature/canvas-first-ux-v2]
    paths:
      - dev/fix-canvas-first-doodle-and-qa.py
      - .github/workflows/fix-canvas-first-doodle-and-qa.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/canvas-first-ux-v2
      - run: python3 dev/fix-canvas-first-doodle-and-qa.py
      - run: node --check app/js/canvas-first-v2.js
      - name: Commit patch
        run: |
          if git diff --quiet -- app/js/canvas-first-v2.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/js/canvas-first-v2.js
          git commit -m 'Fix Doodle Pattern dock and add legacy QA bypass'
          git push origin HEAD:feature/canvas-first-ux-v2
