name: Shape Clean and transparent Doodle export checks
on:
  push:
    branches: [feature/one-tap-shape-clean-20261013]
    paths:
      - app/index.html
      - app/js/editor.js
      - app/js/canvas-first-v2.js
      - app/js/shape-clean.js
      - tests/shape-clean-browser.mjs
      - tests/shape-clean-geometry.test.mjs
      - .github/workflows/shape-clean-checks.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax and geometric shape recognition
        run: |
          node --check app/js/shape-clean.js
          node --check app/js/editor.js
          node --check app/js/canvas-first-v2.js
          node --check tests/shape-clean-browser.mjs
          node tests/shape-clean-geometry.test.mjs
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Test Shape Clean and alpha-transparent Doodle PNG/SVG
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/pf-shapeclean.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node tests/shape-clean-browser.mjs
      - name: Existing editor, SVG, PNG, autosave and export regression suite
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/pf-shapeclean-extended.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          UX2_AUDIT_OUTPUT=/tmp/pf-shape-clean-extended node tests/ux2-extended-readiness.mjs
