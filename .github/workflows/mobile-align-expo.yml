name: Align Expo mobile dependencies

on:
  push:
    branches: [feature/advanced-editing-v1]
    paths:
      - .github/workflows/mobile-align-expo.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/advanced-editing-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Regenerate lockfile from declared dependencies
        working-directory: mobile
        run: |
          rm -f package-lock.json
          npm install
      - name: Align direct packages with Expo SDK 57
        working-directory: mobile
        run: npx expo install --fix
      - name: Commit corrected dependency lock
        run: |
          if git diff --quiet -- mobile/package.json mobile/package-lock.json; then
            echo "Expo dependencies already aligned."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/package.json mobile/package-lock.json
          git commit -m 'Align mobile dependencies with Expo SDK 57'
          git push origin HEAD:feature/advanced-editing-v1
