name: Android preview 1.0.1 cutout test

on:
  pull_request:
    branches:
      - feature/advanced-editing-v1
    types:
      - synchronize
      - reopened

jobs:
  build_android:
    name: Build Android preview APK
    type: build
    params:
      platform: android
      profile: preview-ux2

  comment:
    name: Post APK build to PR
    needs: [build_android]
    type: github-comment
    params:
      message: "Android preview 1.0.1 build finished. Install this build on the test phone and verify the camera/cutout clearance in landscape."
      build_ids:
        - ${{ needs.build_android.outputs.build_id }}
